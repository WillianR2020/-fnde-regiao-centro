<rect width="1080" height="400" fill="#ffffff"/>
<text x="40" y="44" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">A escolha dos 5 — cinco registros não são cinco fornecedores</text><text x="40" y="63" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">Ordenar e cortar em cinco entregava cinco linhas do mesmo domínio, todas sem preço.</text><rect x="40" y="120" width="180" height="100" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="130.0" y="166.0" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#111827" font-weight="400" text-anchor="middle" opacity="1.0">candidatos</text><text x="130.0" y="181.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">todas as coletas de
(item, UF)</text><rect x="270" y="120" width="230" height="100" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="286" y="144" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1d4ed8" font-weight="700" text-anchor="start" opacity="1.0">1. descarta o que não serve</text><text x="286" y="164" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">· sem preço</text><text x="286" y="178" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">· sem print no disco</text><text x="286" y="192" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">· frete em aberto</text><text x="286" y="206" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">· não entrega nesta UF</text><text x="286" y="220" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">· score abaixo do mínimo</text><line x1="224" y1="170" x2="266" y2="170" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="545" y="120" width="230" height="100" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="561" y="144" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1d4ed8" font-weight="700" text-anchor="start" opacity="1.0">2. um registro por domínio</text><text x="561" y="164" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">· a entrega pede 5 fornecedores</text><text x="561" y="178" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">· DISTINTOS, não 5 linhas</text><line x1="499" y1="170" x2="541" y2="170" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="820" y="120" width="230" height="100" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="836" y="144" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#1d4ed8" font-weight="700" text-anchor="start" opacity="1.0">3. ordena e corta</text><text x="836" y="164" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">· maior score_match</text><text x="836" y="178" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">· depois menor preço final</text><line x1="774" y1="170" x2="816" y2="170" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="40" y="268" width="490" height="78" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="60" y="294" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#047857" font-weight="700" text-anchor="start" opacity="1.0">5 linhas na entrega</text><text x="60" y="314" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">5 domínios distintos, cada um com preço e print</text><text x="60" y="332" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">Menos de 5? a combinação item/UF vai para pendencias.csv</text><rect x="560" y="268" width="490" height="78" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="580" y="294" font-family="Consolas,'Courier New',monospace" font-size="14" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">reserva.csv</text><text x="580" y="314" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">todo o resto, COM O MOTIVO de cada exclusão</text><text x="580" y="332" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">sem o motivo, "por que este não entrou?" só se responde reprocessando tudo</text><line x1="700" y1="220" x2="380" y2="264" stroke="#047857" stroke-width="1.8" marker-end="url(#ponta)"/><line x1="900" y1="220" x2="800" y2="264" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/>
</svg>