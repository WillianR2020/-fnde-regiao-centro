<rect width="1000" height="400" fill="#ffffff"/>
<text x="40" y="44" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">Os arquivos de instrução — uma fonte, dois ponteiros</text><text x="40" y="63" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">O repositório não pertence a nenhuma ferramenta de IA.</text><rect x="370" y="110" width="260" height="92" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.2"/><text x="500" y="142" font-family="Consolas,'Courier New',monospace" font-size="18" fill="#1d4ed8" font-weight="700" text-anchor="middle" opacity="1.0">AGENTS.md</text><text x="500" y="164" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="400" text-anchor="middle" opacity="1.0">a fonte única</text><text x="500" y="184" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">o único que se edita</text><rect x="40" y="120" width="230" height="72" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="155.0" y="152.0" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#111827" font-weight="400" text-anchor="middle" opacity="1.0">CLAUDE.md</text><text x="155.0" y="167.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">uma linha: @AGENTS.md</text><text x="155" y="176" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">Claude Code lê este nome</text><line x1="270" y1="156" x2="366" y2="156" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><text x="318.0" y="149.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">aponta</text><rect x="730" y="120" width="230" height="72" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="845.0" y="152.0" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#111827" font-weight="400" text-anchor="middle" opacity="1.0">GEMINI.md</text><text x="845.0" y="167.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">aponta para o AGENTS.md</text><text x="845" y="176" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">Gemini CLI lê este nome</text><line x1="726" y1="156" x2="634" y2="156" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><text x="680.0" y="149.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">aponta</text><rect x="730" y="214" width="230" height="56" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="845.0" y="238.0" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#111827" font-weight="400" text-anchor="middle" opacity="1.0">.gemini/settings.json</text><text x="845.0" y="253.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">faz o Gemini ler direto</text><line x1="726" y1="242" x2="634" y2="190" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)" stroke-dasharray="6 4"/><rect x="40" y="232" width="640" height="56" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="60" y="254" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">Leem AGENTS.md nativamente:</text><text x="60" y="274" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">Codex · Jules · Gemini CLI · Copilot · Cursor · Aider · Zed — e mais de trinta outras</text><rect x="40" y="312" width="920" height="56" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4"/><text x="60" y="334" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#b91c1c" font-weight="700" text-anchor="start" opacity="1.0">Editar CLAUDE.md ou GEMINI.md cria uma divergência</text><text x="60" y="354" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">Em uma semana os arquivos discordam e ninguém sabe qual está certo. Todo conteúdo novo vai para o AGENTS.md.</text>
</svg>