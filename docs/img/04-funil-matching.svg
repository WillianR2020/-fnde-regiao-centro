<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560"
 width="1080" height="560" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ponta-nao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
  </marker>
  <marker id="ponta-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
  </marker>
</defs>
<rect width="1080" height="560" fill="#ffffff"/>
<text x="40" y="44" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">Matching — como um produto é aceito, revisado ou descartado</text><text x="40" y="63" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">Sem EAN e sem marca, isto é o único controle de aderência que existe no projeto.</text><rect x="40" y="100" width="250" height="52" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="165.0" y="122.0" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#111827" font-weight="400" text-anchor="middle" opacity="1.0">descrição do item</text><text x="165.0" y="137.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">texto de licitação, ~300 car.</text><rect x="40" y="164" width="250" height="52" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="165.0" y="186.0" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#111827" font-weight="400" text-anchor="middle" opacity="1.0">título do produto</text><text x="165.0" y="201.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">o que a loja anuncia</text><rect x="340" y="120" width="220" height="76" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="450.0" y="155.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1d4ed8" font-weight="600" text-anchor="middle" opacity="1.0">token_set_ratio</text><text x="450.0" y="171.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">fuzzy sobre texto normalizado</text><line x1="290" y1="126" x2="340" y2="150" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><line x1="290" y1="190" x2="340" y2="168" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="610" y="106" width="430" height="104" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="630" y="128" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">bônus somados ao score</text><text x="630" y="150" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#1d4ed8" font-weight="700" text-anchor="start" opacity="1.0">+25</text><text x="670" y="150" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">medida numérica bate (12 L, 1500 mm)</text><text x="630" y="169" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#1d4ed8" font-weight="700" text-anchor="start" opacity="1.0">+25</text><text x="670" y="169" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">embalagem bate (100 un, 50 pares, kit 5)</text><text x="630" y="188" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#1d4ed8" font-weight="700" text-anchor="start" opacity="1.0">+10</text><text x="670" y="188" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">material bate (inox, alumínio)</text><line x1="560" y1="158" x2="610" y2="158" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="40" y="262" width="1000" height="128" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4"/><text x="60" y="286" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#b91c1c" font-weight="700" text-anchor="start" opacity="1.0">Divergir custa — não basta deixar de ganhar bônus</text><text x="60" y="306" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">Era o buraco: uma panela de 50 L perdia 25 pontos e ainda entrava no lugar de uma de 20 L, porque o fuzzy cobria a diferença.</text><text x="60" y="330" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start" opacity="1.0">•</text><text x="74" y="330" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#111827" font-weight="600" text-anchor="start" opacity="1.0">embalagem divergente</text><text x="266" y="330" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">pede 100, produto traz 50</text><text x="560" y="330" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="start" opacity="1.0">→ DESCARTADO</text><text x="60" y="345" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#b45309" font-weight="700" text-anchor="start" opacity="1.0">•</text><text x="74" y="345" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#111827" font-weight="600" text-anchor="start" opacity="1.0">embalagem não confirmada</text><text x="266" y="345" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">o título não diz quantas vêm</text><text x="560" y="345" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#b45309" font-weight="700" text-anchor="start" opacity="1.0">→ no máx. REVISAR</text><text x="60" y="360" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#b45309" font-weight="700" text-anchor="start" opacity="1.0">•</text><text x="74" y="360" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#111827" font-weight="600" text-anchor="start" opacity="1.0">item avulso, produto em pacote</text><text x="266" y="360" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">preço de pacote na linha de 1 un</text><text x="560" y="360" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#b45309" font-weight="700" text-anchor="start" opacity="1.0">→ no máx. REVISAR</text><text x="60" y="375" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#b45309" font-weight="700" text-anchor="start" opacity="1.0">•</text><text x="74" y="375" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#111827" font-weight="600" text-anchor="start" opacity="1.0">dimensão divergente</text><text x="266" y="375" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">a lista usa 'mínimo' o tempo todo</text><text x="560" y="375" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#b45309" font-weight="700" text-anchor="start" opacity="1.0">→ no máx. REVISAR</text><rect x="40" y="424" width="300" height="72" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="60" y="450" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#047857" font-weight="700" text-anchor="start" opacity="1.0">ACEITO</text><text x="60" y="468" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">score ≥ 80</text><text x="60" y="486" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">entra no plano_coleta.csv</text><line x1="190" y1="390" x2="190" y2="420" stroke="#047857" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="390" y="424" width="300" height="72" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/><text x="410" y="450" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#b45309" font-weight="700" text-anchor="start" opacity="1.0">REVISAR</text><text x="410" y="468" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">60 – 80</text><text x="410" y="486" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">vai para revisar.csv, espera uma pessoa</text><line x1="540" y1="390" x2="540" y2="420" stroke="#b45309" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="740" y="424" width="300" height="72" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/><text x="760" y="450" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#b91c1c" font-weight="700" text-anchor="start" opacity="1.0">DESCARTADO</text><text x="760" y="468" font-family="Consolas,'Courier New',monospace" font-size="11.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">&lt; 60</text><text x="760" y="486" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">não vira Achado</text><line x1="890" y1="390" x2="890" y2="420" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#ponta)"/><text x="40" y="528" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">Use matching.avaliar(), que devolve score E decisão. matching.pontuar() devolve só o número — e reprovar é decisão, não é um número.</text>
</svg>