<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470"
 width="1120" height="470" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<defs>
  <marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
  </marker>
  <marker id="ponta-nao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
  </marker>
  <marker id="ponta-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
          markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
  </marker>
</defs>
<rect width="1120" height="470" fill="#ffffff"/>
<text x="40" y="44" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">Etapa 1 — como um candidato vira fornecedor aprovado</text><text x="40" y="63" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">90% desta etapa é código. A pesquisa manual entra só para achar candidatos novos.</text><rect x="40" y="110" width="176" height="64" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="128.0" y="139.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1d4ed8" font-weight="600" text-anchor="middle" opacity="1.0">unificar</text><text x="128.0" y="155.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">2 bases + leads</text><rect x="252" y="110" width="176" height="64" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="340.0" y="139.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1d4ed8" font-weight="600" text-anchor="middle" opacity="1.0">achar CNPJ</text><text x="340.0" y="155.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">regex no rodapé</text><line x1="220" y1="142.0" x2="248" y2="142.0" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="464" y="110" width="176" height="64" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="552.0" y="139.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1d4ed8" font-weight="600" text-anchor="middle" opacity="1.0">consultar</text><text x="552.0" y="155.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">Receita / BrasilAPI</text><line x1="432" y1="142.0" x2="460" y2="142.0" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="676" y="110" width="176" height="64" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="764.0" y="139.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1d4ed8" font-weight="600" text-anchor="middle" opacity="1.0">classificar</text><text x="764.0" y="155.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">CNAE 46 / 47</text><line x1="644" y1="142.0" x2="672" y2="142.0" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="888" y="110" width="176" height="64" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="976.0" y="139.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1d4ed8" font-weight="600" text-anchor="middle" opacity="1.0">testar entrega</text><text x="976.0" y="155.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">3 CEPs do Sul</text><line x1="856" y1="142.0" x2="884" y2="142.0" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="40" y="212" width="176" height="50" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="128.0" y="233.0" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#111827" font-weight="400" text-anchor="middle" opacity="1.0">data/raw/leads/</text><text x="128.0" y="248.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">formato livre</text><line x1="128" y1="212" x2="128" y2="178" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="636" y="236" width="444" height="160" rx="6" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="5 4"/><text x="656" y="260" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">O que decide o status</text><rect x="656" y="276" width="96" height="26" rx="4" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/><text x="704" y="294" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#047857" font-weight="700" text-anchor="middle" opacity="1.0">APROVADO</text><text x="766" y="288" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">CNAE 46 no principal, CNPJ ATIVO, e a loja</text><text x="766" y="302" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">entrega em ao menos uma UF do Sul</text><rect x="656" y="316" width="96" height="26" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/><text x="704" y="334" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="middle" opacity="1.0">REPROVADO</text><text x="766" y="328" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">CNAE de varejo puro, CNPJ não-ativo, ou</text><text x="766" y="342" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">RECUSA de entrega nas três UFs</text><rect x="656" y="356" width="96" height="26" rx="4" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/><text x="704" y="374" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#b45309" font-weight="700" text-anchor="middle" opacity="1.0">PENDENTE</text><text x="766" y="368" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">faltou CNPJ, a consulta falhou, ou a entrega</text><text x="766" y="382" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">não deu para confirmar</text><line x1="790" y1="174" x2="790" y2="232" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="40" y="320" width="340" height="56" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/><text x="210.0" y="344.0" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#111827" font-weight="400" text-anchor="middle" opacity="1.0">data/interim/fornecedores_master.csv</text><text x="210.0" y="359.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">o banco de sites — regra inviolável 3</text><line x1="632" y1="330" x2="386" y2="344" stroke="#047857" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="40" y="396" width="340" height="44" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="210.0" y="414.0" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#111827" font-weight="400" text-anchor="middle" opacity="1.0">data/interim/sem_site.csv</text><text x="210.0" y="429.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">72 empresas com CNPJ e sem domínio</text>
</svg>