<rect width="1120" height="520" fill="#ffffff"/>
<text x="40" y="44" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">Os módulos e as fronteiras entre as frentes</text><text x="40" y="63" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">A estrutura existe para que 9 pessoas trabalhem em paralelo sem colidir nos mesmos arquivos.</text><rect x="40" y="100" width="240" height="148" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="54" y="124" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">src/core/</text><text x="266" y="124" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1d4ed8" font-weight="600" text-anchor="end" opacity="1.0">Frente A</text><text x="54" y="146" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">http.py — sessão, cache, erros</text><text x="54" y="163" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">log.py — o diagnóstico</text><text x="54" y="180" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">tabelas.py — os CSV</text><text x="54" y="197" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">matching.py — Frente E</text><text x="54" y="214" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">frete.py — Frente F</text><text x="54" y="231" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">plataforma.py — detecção</text><rect x="320" y="100" width="240" height="148" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="334" y="124" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">src/adapters/</text><text x="546" y="124" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1d4ed8" font-weight="600" text-anchor="end" opacity="1.0">Frente D</text><text x="334" y="146" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">base.py — Executor (ABC)</text><text x="334" y="163" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">registro.py — escolhe a classe</text><text x="334" y="180" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">vtex.py ✔ completo</text><text x="334" y="197" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">woocommerce · shopify</text><text x="334" y="214" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">nuvemshop — busca pronta</text><text x="334" y="231" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">generico_playwright ✖</text><rect x="600" y="100" width="240" height="131" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="614" y="124" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">src/runners/</text><text x="826" y="124" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1d4ed8" font-weight="600" text-anchor="end" opacity="1.0">Frentes A e B</text><text x="614" y="146" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">etapa0_limpar_itens</text><text x="614" y="163" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">etapa1_validar — Frente B</text><text x="614" y="180" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">etapa2_varredura</text><text x="614" y="197" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">etapa2_plano</text><text x="614" y="214" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">etapa3_coletar</text><rect x="880" y="100" width="200" height="97" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="894" y="124" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">src/export/</text><text x="1066" y="124" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1d4ed8" font-weight="600" text-anchor="end" opacity="1.0">Frente F</text><text x="894" y="146" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">montar_entrega.py</text><text x="894" y="163" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">prints.py</text><text x="894" y="180" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">captura.py</text><rect x="40" y="262" width="240" height="60" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/><text x="54" y="286" font-family="Consolas,'Courier New',monospace" font-size="13" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">src/validacao/</text><text x="266" y="286" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1d4ed8" font-weight="600" text-anchor="end" opacity="1.0">Frente B</text><text x="54" y="306" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">extrair · consultar · classificar CNPJ</text><rect x="40" y="340" width="1040" height="54" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/><text x="60" y="364" font-family="Consolas,'Courier New',monospace" font-size="13.5" fill="#1d4ed8" font-weight="700" text-anchor="start" opacity="1.0">src/models.py — O CONTRATO</text><text x="60" y="382" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">Item · Fornecedor · ProdutoBruto · Achado · Coleta. É o único ponto onde 9 pessoas colidem de verdade: ninguém altera sozinho.</text><rect x="40" y="416" width="510" height="76" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5" stroke-dasharray="5 4"/><text x="60" y="440" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#047857" font-weight="700" text-anchor="start" opacity="1.0">Fronteira 1 — adapter ⟷ matching</text><text x="60" y="458" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">O adapter recebe um termo e devolve ProdutoBruto. Não pontua,</text><text x="60" y="474" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">não filtra, não decide. Quem faz matching nunca abre um site.</text><rect x="570" y="416" width="510" height="76" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.5" stroke-dasharray="5 4"/><text x="590" y="440" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#047857" font-weight="700" text-anchor="start" opacity="1.0">Fronteira 2 — coletor ⟷ montador</text><text x="590" y="458" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">O coletor escreve .jsonl cru e não conhece o template do FNDE.</text><text x="590" y="474" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#111827" font-weight="400" text-anchor="start" opacity="1.0">Trocar o formato da entrega não toca em uma linha de scraper.</text>
</svg>