<rect width="1000" height="430" fill="#ffffff"/>
<text x="40" y="44" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#111827" font-weight="700" text-anchor="start" opacity="1.0">As duas fases leem planos diferentes</text><text x="40" y="63" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">A dependência circular que isto resolve foi um bug real do projeto.</text><rect x="40" y="120" width="230" height="58" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="155.0" y="145.0" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#111827" font-weight="400" text-anchor="middle" opacity="1.0">fornecedores_master.csv</text><text x="155.0" y="160.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">só os APROVADOS</text><rect x="330" y="112" width="210" height="72" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="435.0" y="145.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1d4ed8" font-weight="600" text-anchor="middle" opacity="1.0">varredura</text><text x="435.0" y="161.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">todo site × todo item</text><rect x="600" y="120" width="210" height="58" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="705.0" y="145.0" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#111827" font-weight="400" text-anchor="middle" opacity="1.0">achados/{dominio}.csv</text><text x="705.0" y="160.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">quem tem o quê</text><line x1="270" y1="149" x2="330" y2="149" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><text x="300.0" y="142.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1d4ed8" font-weight="400" text-anchor="middle" opacity="1.0">plano de BUSCA</text><line x1="540" y1="149" x2="600" y2="149" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="600" y="250" width="210" height="62" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="705.0" y="278.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1d4ed8" font-weight="600" text-anchor="middle" opacity="1.0">etapa2_plano</text><text x="705.0" y="294.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">consolida</text><line x1="705" y1="178" x2="705" y2="250" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="330" y="258" width="210" height="54" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/><text x="435.0" y="281.0" font-family="Consolas,'Courier New',monospace" font-size="12" fill="#111827" font-weight="400" text-anchor="middle" opacity="1.0">plano_coleta.csv</text><text x="435.0" y="296.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">site → itens</text><line x1="600" y1="285" x2="540" y2="285" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><rect x="40" y="250" width="230" height="62" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/><text x="155.0" y="278.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1d4ed8" font-weight="600" text-anchor="middle" opacity="1.0">coleta</text><text x="155.0" y="294.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#6b7280" font-weight="400" text-anchor="middle" opacity="1.0">preço · frete · print</text><line x1="330" y1="285" x2="270" y2="285" stroke="#9ca3af" stroke-width="1.8" marker-end="url(#ponta)"/><text x="300.0" y="278.0" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#1d4ed8" font-weight="400" text-anchor="middle" opacity="1.0">plano de COLETA</text><line x1="390" y1="258" x2="390" y2="190" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#ponta)" stroke-dasharray="6 4"/><g stroke="#b91c1c" stroke-width="3"><line x1="368" y1="212" x2="412" y2="236"/><line x1="412" y1="212" x2="368" y2="236"/></g><text x="430" y="228" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#b91c1c" font-weight="600" text-anchor="start" opacity="1.0">a varredura nunca lê o plano de coleta</text><rect x="40" y="348" width="920" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/><text x="60" y="370" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#111827" font-weight="600" text-anchor="start" opacity="1.0">Quem escolhe entre os dois é montar_lotes(fase, …), no orquestrador.</text><text x="60" y="388" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b7280" font-weight="400" text-anchor="start" opacity="1.0">Numa base nova, só a varredura consegue começar — e é exatamente essa a ordem correta das etapas.</text>
</svg>